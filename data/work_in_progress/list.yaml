- title: "The (long-term) consequences of austerity policy on mortality and temperature relationship: Evidence from Italy"
  coauthors: "Filippo Pavanello and Guglielmo Zappalà"

- title: "Macroeconomic Repercussions of Heatwave Impacts on Labor Productivity in European Regions"
  coauthors: "Amsalu Woldie Yalew, Francesco Bosello, Catarina Midões and Gabriele Standardi"
  abstract: >
   Extreme heat events are becoming more frequent, longer, and intense in Europe, calling for more evidence on their socio-economic consequences. This study assesses the sectoral and macroeconomic consequences of labor productivity losses induced by heatwaves using a regionalized global computable general equilibrium (CGE) model with subnational details for 13 European countries that stipulate several labor market conditions with different possibilities of inter-regional and inter-sectoral labor mobilities. We show that the impacts of heatwaves on labor, on production activities, and on the overall economy are uneven across European subregions, with higher GDP losses concentrated in the southern and eastern Mediterranean regions. Depending on the assumption about how labor market equilibrium is attained, compared to assumptions of no inter-regional mobilities at all, intra-EU or intra-national labor mobility would dampen the adverse effects in some subnational regions but worsen the effects in others. Our findings suggest that policies targeting flexible wages to maintain observed total employment could help to offset some of the adverse macroeconomic impacts.
  


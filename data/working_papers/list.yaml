- title: "Mortality, Temperature, and Public Adaptation Policy: Evidence from Italy"
  pdflink: "https://fpavanello.github.io/files/fp_gv_hhws.pdf"
  coauthors: "Filippo Pavanello"
  abstract: >
   In 2004, Italy introduced a national program to address heat-related health risks through public awareness campaigns, heatwave warning systems, and hospital protocols. Leveraging administrative mortality data, temperature variations, and the plausibly exogenous timing of the policy’s rollout, this paper shows that the program mitigated the mortality impact of extreme heat (days at or above 30 °C) by more than 57%. Exploring the mechanisms, we find that the staggered implementation of the heat wave warning systems contributed to reducing excess mortality on days exceeding 30 °C in treated provinces. We further show that enhancing access to information is essential to achieving these mitigating effects. Our findings underscore the critical role of public adaptation policies that leverage information disclosure on the health risks associated with heat stress.

- title: "Hot Wages: How Do Heat Waves Change the Earnings Distribution?"
  pdflink: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5096539"
  coauthors: "Francesco Vona"
  status: "Under review"
  abstract: >
   We investigate the effects of heat waves on individual earnings using rich retrospective panel data from the Survey of Health, Ageing and Retirement in Europe (SHARE), matched with high-resolution weather data from the E-OBS dataset. Our analysis covers over 32000 workers across 14 European countries from 1955 to 2019, spanning a wide range of sectors and occupations. Our identification leverages plausibly exogenous variation in heat-wave exposure by comparing individuals from different cohorts within the same generation and sub-region, while controlling for individual fixed effects, occupational sorting, and covariate balance. We find that each additional day of a heat wave reduces annual earnings by 0.31%, corresponding on average to a loss of $159.63 per year. The effect is particularly pronounced in outdoor heat-exposed occupations, with an average annual loss of $272.57, and is especially strong among workers performing manual and clerical tasks. Importantly, the impact is substantially mitigated in countries with highly centralized collective bargaining systems. Finally, our findings indicate that heat waves exacerbate existing income inequalities, disproportionately harming individuals with lower education, lower income, and disadvantaged family backgrounds.

- title: "Temperature and Health Capital: Long-Term Consequences of Exposure in Childhood"
  coauthors: "Catarina Midões, Francesco Vona and Enrica De Cian"
  abstract: >
   This paper investigates the impact of temperature shocks, measured by the duration of heat and cold waves, on a comprehensive health measure. The proposed metric encompasses a broad range of illnesses that can be triggered or exacerbated by temperature exposure. Within a human capital framework, we approximate health capital loss using the number of days lost due to disability, quantifying the severity of poor health across various life stages. Our results reveal that exposure to heat waves during childhood, particularly before the age of 10, has long-term effects on adult health. It increases the likelihood of developing illnesses and significantly affects both the severity (measured by days lost due to disability) and the duration (years impacted by illness) of morbidity in later life. The heightened sensitivity to high temperatures during childhood can be attributed to physiological factors in development that limit the ability to regulate body temperature effectively. Furthermore, children may have a restricted capacity to express discomfort caused by thermal stress and to adopt protective measures against extreme heat. Our findings show that the effect of exposure during childhood is persistent over time and that childhood exposure significantly shapes the subsequent accumulation of health capital, with potential compensatory behaviours appearing unable to fully mitigate the consequences. Our findings contribute to the assessment of climate change damages and their distributional implications by investigating long-term health consequences. Additionally, our study provides valuable insights into the literature on early childhood shocks, by considering the under-explored role of temperature shocks.


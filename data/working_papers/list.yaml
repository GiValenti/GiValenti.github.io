- title: "Mortality, Temperature, and Public Adaptation Policy: Evidence from Italy"
  pdflink: "https://feem-media.s3.eu-central-1.amazonaws.com/wp-content/uploads/NDL2025-35.pdf"
  coauthors: "Filippo Pavanello"
  abstract: >
   In 2004, Italy introduced a national program to address heat-related health risks, combining public awareness campaigns, heat-wave warning systems, and hospital protocols. Leveraging administrative mortality data and high-frequency temperature variation, we show that the program reduced heat-related mortality by more than 57% on days at or above 30°C. To identify the mechanisms, we exploit the staggered introduction of heat-wave warning systems across provinces and show that treated areas experienced substantially larger reductions in heat-related mortality. We further document that information disclosure plays a key role in driving these reductions. Overall, our findings underscore the importance of public adaptation policies that rely on information provision to cost-effectively mitigate the health impacts of extreme temperatures.
   
- title: "Heat Waves and Earnings: Distributional Impacts and the Role of Labor Market Institutions"
  pdflink: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5096539"
  coauthors: "Francesco Vona"
  abstract: >
   Despite evidence that heat reduces labor supply and productivity, its direct impact on worker welfare through earnings remains unclear. Using SHARE longitudinal data matched with high-resolution E-OBS weather records for over 32,000 workers across 14 European countries (1955–2018), we exploit plausibly exogenous variation in heat wave exposure across cohorts within the same generation and location, controlling for individual fixed effects and occupational sorting. Each additional heat wave day reduces total earnings by 0.31%, with the burden falling disproportionately on exposed occupations and on low-income and disadvantaged workers. Labor market institutions substantially attenuate these losses, revealing their mediating role.
   
- title: "Temperature and Health Capital: Long-Term Consequences of Exposure in Childhood"
  coauthors: "Catarina Midões, Francesco Vona and Enrica De Cian"
  abstract: >
   This paper investigates the impact of temperature shocks, measured by the duration of heat and cold waves, on a comprehensive health measure. The proposed metric encompasses a broad range of illnesses that can be triggered or exacerbated by temperature exposure. Within a human capital framework, we approximate health capital loss using the number of days lost due to disability, quantifying the severity of poor health across various life stages. Our results reveal that exposure to heat waves during childhood, particularly before the age of 10, has long-term effects on adult health. It increases the likelihood of developing illnesses and significantly affects both the severity (measured by days lost due to disability) and the duration (years impacted by illness) of morbidity in later life. The heightened sensitivity to high temperatures during childhood can be attributed to physiological factors in development that limit the ability to regulate body temperature effectively. Furthermore, children may have a restricted capacity to express discomfort caused by thermal stress and to adopt protective measures against extreme heat. Our findings show that the effect of exposure during childhood is persistent over time and that childhood exposure significantly shapes the subsequent accumulation of health capital, with potential compensatory behaviours appearing unable to fully mitigate the consequences. Our findings contribute to the assessment of climate change damages and their distributional implications by investigating long-term health consequences. Additionally, our study provides valuable insights into the literature on early childhood shocks, by considering the under-explored role of temperature shocks.

- title: "Heat, Incarceration, and Mortality: Evidence from Italian Prisons"
  pdflink: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=7569899"
  coauthors: "Catarina Midões and Nicolò Gebbani"
  abstract: >
   Incarcerated people, an extremely vulnerable population, depend entirely on institutional decisions for heat protection, being excluded from or severely limited in every margin of private adaptation, both behavioural and technological. We provide the first evidence on heat and mortality in a national prison system outside the United States, combining daily deaths and suicides in Italian penitentiary institutions from 2002 to 2024 with downscaled ERA5 weather data. A day reaching 35°C carries 19.5% higher mortality and 24.7% higher suicide risk than a day at 28°C. The impacts of heat are substantially larger than in the general population. Heat caused an additional 133 custodial deaths, including 63 suicides, over the sample period. Effects on all-cause mortality were larger in overcrowded institutions. Effects on both overall deaths and suicides were smaller in renovated buildings. These findings suggest that the burden of heat is shaped not only by the state's initial decision to incarcerate, which increases baseline risk, but also by institutional conditions, which affect heat exposure. It can therefore be reduced through public policy.
